server:
  port: 8080

spring:
  application:
    name: UGVC-System
  profiles:
    active: xutest

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
jwt:
  issuer: "ug-vc"
pagehelper:
  helper-dialect: mysql
  reasonable: true
  support-methods-arguments: true
  params: count=countSql